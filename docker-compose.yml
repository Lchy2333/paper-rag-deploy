# paper-rag 生产编排
# 用法：docker compose up -d（需先配置 env/ 下的密钥文件，见 README）
# 注意：build 路径引用的是同级的三个业务仓库（clone 时保持并列目录）
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: prg-postgres
    ports:
      - "127.0.0.1:5432:5432"   # 仅绑本机回环，供 Navicat 走 SSH 隧道连接；不对外暴露（安全组无需放行）
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD（.env）}
    volumes:
      # PG18+ 镜像要求数据卷挂到 /var/lib/postgresql（含主版本号子目录，兼容 pg_ctlcluster）
      - pgdata:/var/lib/postgresql
      # 首次启动初始化：建库 + 建表（init.sh 建两库后分别执行 /sql/*.sql）
      - ./init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ../paper-rag-backend/db/init.sql:/sql/10-rag.sql:ro
      - ../paper-rag-agent/migrations/001_init.sql:/sql/20-agent-001.sql:ro
      - ../paper-rag-agent/migrations/002_threads_pinned.sql:/sql/30-agent-002.sql:ro
      - ../paper-rag-agent/migrations/003_query_usage.sql:/sql/40-agent-003.sql:ro
      - ../paper-rag-agent/migrations/004_query_usage_last_input.sql:/sql/50-agent-004.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rag:
    build: ../paper-rag-backend
    container_name: prg-rag
    env_file: ./env/rag.prod.env
    volumes:
      - uploads:/app/uploads          # 上传的 PDF 持久化
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  agent:
    build: ../paper-rag-agent
    container_name: prg-agent
    env_file: ./env/agent.prod.env
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # MCP Server（streamable-http 常驻服务）
  # env/mcp.prod.env 必备项（该目录不入库，服务器上手工维护）：
  #   MCP_TRANSPORT=streamable-http
  #   MCP_HOST=0.0.0.0            ← 必须，容器内绑 127.0.0.1 端口映射后不可达
  #   MCP_PORT=8765
  #   RAG_BASE_URL=http://rag:8080
  #   AGENT_BASE_URL=http://agent:8001
  #   RAG_API_KEY=<与 env/rag.prod.env 的 RAG_API_KEY 相同>
  # 禁止配置 PAPER_RAG_TOKEN：身份只来自每次请求的 Authorization 头
  mcp:
    build: ../paper-rag-mcp
    container_name: prg-mcp
    env_file: ./env/mcp.prod.env
    ports:
      - "8765:8765"   # 公网暴露时靠 JWT + introspect 鉴权；建议配合安全组/防火墙收敛来源
    depends_on:
      agent:
        condition: service_healthy
      rag:
        condition: service_healthy
    healthcheck:
      # 镜像内无 curl，用 python 探 TCP 端口
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8765), 2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  fronted:
    build: ../paper-rag-fronted
    container_name: prg-fronted
    ports:
      - "80:80"
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
